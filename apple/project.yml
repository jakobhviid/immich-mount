# The macOS edition's Xcode project (ARCHITECTURE.md, "The macOS edition"). `xcodegen` writes ImmichMount.xcodeproj
# from this file after `build-rust.sh` has built the bridge; neither result is committed.
name: ImmichMount
options:
  bundleIdPrefix: dev.hviid
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  ImmichMount:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [AppIcon.icon]
      # The Icon Composer icon is one document, not a folder of resources; macOS 26 and later show it, and the asset
      # catalog's AppIcon set stays for macOS 14 and 15 (ARCHITECTURE.md, "The icon").
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
      - Shared
      - build/Generated
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hviid.ImmichMount
        PRODUCT_NAME: Immich Mount
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/ImmichMount.entitlements
        # Empty in a development build, signed automatically; apple/release.sh names the Developer ID profile.
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: FileProvider
        embed: true
      - framework: build/ImmichMountCore.xcframework
        embed: false
      - sdk: Security.framework

  FileProvider:
    type: app-extension
    platform: macOS
    sources:
      - FileProvider
      - Shared
      - build/Generated
      # The app's icon, for System Settings' list of file providers.
      - App/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hviid.ImmichMount.FileProvider
        PRODUCT_NAME: ImmichMountFileProvider
        INFOPLIST_FILE: FileProvider/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FileProvider/FileProvider.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(EXTENSION_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - framework: build/ImmichMountCore.xcframework
        embed: false
      - sdk: Security.framework

schemes:
  ImmichMount:
    build:
      targets:
        ImmichMount: all
    run:
      config: Debug
    archive:
      config: Release
