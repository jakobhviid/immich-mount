# The macOS edition's Xcode project (ARCHITECTURE.md, "The macOS edition"). `xcodegen` writes ImmichMount.xcodeproj
# from this file after `build-rust.sh` has built the bridge; neither result is committed.
name: ImmichMount
options:
  bundleIdPrefix: dev.hviid
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

# Sparkle (MIT) updates the app in place from the download page's appcast (ARCHITECTURE.md, "The macOS edition",
# "Distribution").
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    # The app's identity: its bundle identifier, App Group and Keychain group, and the name Finder and System
    # Settings show. A Debug build is Immich Mount Dev, with an identity of its own, so it signs in, keeps settings
    # and adds a Finder location apart from the installed release (AGENTS.md, "Development environment").
    IMMICH_IDENTITY: dev.hviid.ImmichMount
    APP_DISPLAY_NAME: Immich Mount
    APP_ICON: AppIcon
    SIDEBAR_SYMBOL: SidebarSymbol
  configs:
    # Blue where the release is white or grey: the app icon, Finder's sidebar symbol and the menu bar icon.
    Debug:
      IMMICH_IDENTITY: dev.hviid.ImmichMount.Dev
      APP_DISPLAY_NAME: Immich Mount Dev
      APP_ICON: AppIconDev
      SIDEBAR_SYMBOL: SidebarSymbolDev

targets:
  ImmichMount:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [AppIcon.icon, AppIconDev.icon]
      # The Icon Composer icon is one document, not a folder of resources; macOS 26 and later show it, and the asset
      # catalog's AppIcon set stays for macOS 14 and 15 (ARCHITECTURE.md, "The icon"). AppIconDev is the Dev build's.
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
      - path: App/AppIconDev.icon
        type: file
        buildPhase: resources
      # Sparkle's license asks for its notice to travel with the app.
      - path: ../THIRD-PARTY-NOTICES.md
        buildPhase: resources
      - Shared
      - build/Generated
      # One <language>.lproj per language, made from po/ by build-rust.sh (ARCHITECTURE.md, "Translations").
      - path: build/Localization
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IMMICH_IDENTITY)
        PRODUCT_NAME: $(APP_DISPLAY_NAME)
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/ImmichMount.entitlements
        # Empty in a development build, signed automatically; apple/release.sh names the Developer ID profile.
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: $(APP_ICON)
    dependencies:
      - target: FileProvider
        embed: true
      - framework: build/ImmichMountCore.xcframework
        embed: false
      - sdk: Security.framework
      - package: Sparkle

  FileProvider:
    type: app-extension
    platform: macOS
    sources:
      - FileProvider
      - Shared
      - build/Generated
      # The app's icon, for System Settings' list of file providers.
      - App/Assets.xcassets
      # The app's texts, for the names of Finder's actions, which Finder looks up in the extension's
      # Localizable.strings.
      - path: build/Localization
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IMMICH_IDENTITY).FileProvider
        PRODUCT_NAME: ImmichMountFileProvider
        INFOPLIST_FILE: FileProvider/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FileProvider/FileProvider.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(EXTENSION_PROFILE)
        # The same in both configurations: the app embeds the extension by the file name the project fixes when it
        # is generated, so a Debug-only name broke the Release build. Stop the Dev one by its path, never its name.
        ASSETCATALOG_COMPILER_APPICON_NAME: $(APP_ICON)
    dependencies:
      - framework: build/ImmichMountCore.xcframework
        embed: false
      - sdk: Security.framework

schemes:
  ImmichMount:
    build:
      targets:
        ImmichMount: all
    run:
      config: Debug
    archive:
      config: Release
