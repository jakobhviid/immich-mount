name: retry

# Why: a release that fails on GitHub's side (runners that cannot resolve a mirror, the artifact service answering
# with an error page; both seen on 2026-11-11) needs only its failed jobs run again. This does that once, by itself:
# a run that fails again, or fails in our own code, stays failed for a person to read. A run cancelled by a newer
# push is left alone.
on:
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Run the failed jobs again, once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN" --failed --repo "$GITHUB_REPOSITORY"
