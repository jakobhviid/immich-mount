name: ci

# main is gated by release.yml; this runs on every other branch and on pull requests.
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin
      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --exclude immich-mount-gnome --exclude immich-mount-kde --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace --exclude immich-mount-gnome --exclude immich-mount-kde
      - name: the core stays portable
        run: cargo check -p immich-api -p immich-mount-core --no-default-features --target aarch64-apple-darwin
      - name: the translations match the sources, placeholders kept
        run: python3 po/i18n.py check
      - name: the download page builds, for the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site/build-latest.sh _site

  contract:
    # immich-api against a real Immich server: the lab's seed in the runner's Docker (lab/immich-server/ci.sh), then
    # every contract test, the spec check included, on the oldest supported version and the current one.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        immich: [v3.2.0, v3.3.6]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Restored and saved apart, so the downloads are kept even when a later step fails.
      - name: Fixture cache (Commons photos, pinned by sha1)
        id: fixtures
        uses: actions/cache/restore@v4
        with:
          path: lab/immich-server/fixtures/cache
          key: fixtures-${{ hashFiles('lab/immich-server/fixtures/manifest.json') }}
      - name: Fixtures, every one (the contract tests count both videos)
        run: FIXTURES_ALL=1 FIXTURES_LENIENT=1 lab/immich-server/fixtures.sh
      - name: Save the fixture cache
        if: steps.fixtures.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: lab/immich-server/fixtures/cache
          key: fixtures-${{ hashFiles('lab/immich-server/fixtures/manifest.json') }}
      - name: Immich ${{ matrix.immich }}, seeded
        run: lab/immich-server/ci.sh ${{ matrix.immich }}
      - name: Contract tests
        run: |
          set -a; . lab/immich-server/.env.local; set +a
          cargo test -p immich-api --tests -- --ignored --test-threads=1

  fedora-apps:
    # The desktop apps need newer libraries than Ubuntu's (GTK 4.18, libadwaita 1.8 and blueprint-compiler for GNOME;
    # Qt 6 for KDE), so they are checked in the distribution they are developed against.
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Build dependencies
        run: |
          dnf install -y -q git gcc gcc-c++ cargo rust clippy gtk4-devel libadwaita-devel blueprint-compiler nautilus-devel \
            qt6-qtbase-devel qt6-qtdeclarative-devel cmake extra-cmake-modules kf6-kio-devel
      - uses: actions/checkout@v5
      - name: Green gate for the apps - clippy (warnings are errors) and tests
        run: |
          cargo clippy -p immich-mount-gnome -p immich-mount-kde --all-targets -- -D warnings
          cargo test -p immich-mount-gnome -p immich-mount-kde
      - name: Files' extension (warnings are errors)
        run: crates/immich-mount-gnome/nautilus/build.sh "$RUNNER_TEMP/libimmich-mount-nautilus.so"
      - name: Dolphin's plugin (warnings are errors)
        run: crates/immich-mount-kde/dolphin/build.sh "$RUNNER_TEMP/immich-mount-dolphin.so"

  macos:
    # The macOS edition (ARCHITECTURE.md, "The macOS edition"): the portable crates' and the bridge's clippy and tests
    # on a Mac, then the Swift app and File Provider extension built unsigned against the bridge. A Rust change is
    # checked against the Swift side here, without a Mac at hand.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: clippy (warnings are errors) and tests of the portable crates and the bridge
        run: |
          cargo clippy -p immich-api -p immich-mount-core -p immich-mount-apple --all-targets -- -D warnings
          cargo test -p immich-api -p immich-mount-core -p immich-mount-apple
      - name: The bridge for Xcode
        run: apple/build-rust.sh debug
      - name: The app and the extension, unsigned
        run: |
          xcodebuild -version
          brew install xcodegen
          cd apple && xcodegen
          xcodebuild -project ImmichMount.xcodeproj -scheme ImmichMount -configuration Debug -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build
      - name: The disk image, unsigned, as the release builds it
        run: apple/release.sh --unsigned
