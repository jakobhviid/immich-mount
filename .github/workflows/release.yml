name: release

# The house release pipeline, adapted: Linux musl builds of the daemon and CLI, the desktop apps' packages, and a
# GitHub release, and the headless formula in the Homebrew tap (jakobhviid/homebrew-tap), whose own pipeline bumps the
# app's cask.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A burst of pushes releases once: a newer push cancels the run before it.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin
      - name: Green gate - clippy (warnings are errors), tests, and the portable core
        run: |
          cargo clippy --workspace --exclude immich-mount-gnome --exclude immich-mount-kde --all-targets -- -D warnings
          cargo test --workspace --exclude immich-mount-gnome --exclude immich-mount-kde
          cargo check -p immich-api -p immich-mount-core --no-default-features --target aarch64-apple-darwin
      - name: The mount through the kernel (FUSE), with an in-memory library
        run: |
          # The runner has /dev/fuse; fusermount3 comes with fuse3. These tests catch what only a real mount shows
          # (modes copies get, access(), peeks, a busy unmount), before any release reaches a VM.
          sudo apt-get install -y -qq fuse3 >/dev/null
          cargo test -p immich-mount-linux --test mount -- --ignored

  fedora-apps:
    # The desktop apps need newer libraries than Ubuntu's (GTK 4.18, libadwaita 1.8 and blueprint-compiler for GNOME;
    # Qt 6 for KDE), so they are checked, and packaged as rpms, in the distribution they are developed against. The
    # KDE app uses Qt's private QML API, so its rpm is tied to this release's Qt and is rebuilt with it.
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Build dependencies
        run: |
          dnf install -y -q git gcc gcc-c++ cargo rust clippy gtk4-devel libadwaita-devel blueprint-compiler rpm-build python3 \
            qt6-qtbase-devel qt6-qtdeclarative-devel
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Cache cargo (crates and build output)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fedora44-apps-${{ hashFiles('Cargo.lock') }}
          restore-keys: fedora44-apps-
      - name: Stamp version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          v=$(git log --reverse --format='%H%x09%s' | awk -F'\t' 'BEGIN{maj=1;min=0;pat=0}NR==1{next}{s=$2;if(s~/^[A-Za-z]+(\([^)]*\))?!:/){maj++;min=0;pat=0}else if(s~/^feat(\([^)]*\))?:/){min++;pat=0}else{pat++}}END{print maj"."min"."pat}')
          tmp=$(mktemp)
          sed -E "s/^version = \"[^\"]*\"/version = \"$v\"/" Cargo.toml > "$tmp" && mv "$tmp" Cargo.toml
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Green gate for the apps - clippy (warnings are errors) and tests
        run: |
          cargo clippy -p immich-mount-gnome -p immich-mount-kde --all-targets -- -D warnings
          cargo test -p immich-mount-gnome -p immich-mount-kde
      - name: Package the apps (rpms for this Fedora release)
        run: |
          cargo build --release -p immich-mount-gnome -p immich-mount-kde
          payload="$PWD/dist/payload"
          mkdir -p "$payload"
          cp target/release/immich-mount-gnome LICENSE "$payload/"
          python3 packaging/third-party-licenses.py "$payload/THIRD-PARTY-LICENSES.md" immich-mount-gnome
          rpmbuild -bb --define "_topdir $PWD/dist/rpmbuild" --define "pkg_version $VERSION" --define "payload $payload" \
            packaging/rpm/immich-mount-gnome.spec
          kde="$PWD/dist/payload-kde"
          mkdir -p "$kde"
          cp target/release/immich-mount-kde LICENSE "$kde/"
          python3 packaging/third-party-licenses.py "$kde/THIRD-PARTY-LICENSES.md" immich-mount-kde
          rpmbuild -bb --define "_topdir $PWD/dist/rpmbuild" --define "pkg_version $VERSION" --define "payload $kde" \
            packaging/rpm/immich-mount-kde.spec
          cp dist/rpmbuild/RPMS/*/*.rpm dist/
          # For Homebrew's cask: both interfaces, the launcher entry with its @BINDIR@ left for the cask to fill in,
          # and the icons. Built here, so it links this Fedora's GTK and Qt; the release job adds the static daemon.
          app="$PWD/dist/app"
          mkdir -p "$app"
          cp target/release/immich-mount-gnome target/release/immich-mount-kde LICENSE packaging/icons/*.svg "$app/"
          cp packaging/desktop/dev.hviid.ImmichMount.desktop.in "$app/dev.hviid.ImmichMount.desktop"
          python3 packaging/third-party-licenses.py "$app/THIRD-PARTY-LICENSES.md" immich-mount-gnome immich-mount-kde immich-mount
          tar czf dist/immich-mount-app-x86_64.tar.gz -C "$app" .
          ls -l dist/*.rpm dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-apps
          path: |
            dist/*.rpm
            dist/*.tar.gz


  ubuntu-apps:
    # The desktop apps for Ubuntu 26.04 (GTK 4.22 and libadwaita 1.9 for GNOME; Qt 6.10 and KF 6.24 for Kubuntu),
    # built and packaged in that release.
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq git gcc g++ pkg-config libgtk-4-dev libadwaita-1-dev blueprint-compiler rustc cargo dpkg-dev python3 \
            qt6-base-dev qt6-declarative-dev >/dev/null
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Cache cargo (crates and build output)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu2604-apps-${{ hashFiles('Cargo.lock') }}
          restore-keys: ubuntu2604-apps-
      - name: Stamp version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          v=$(git log --reverse --format='%H%x09%s' | awk -F'\t' 'BEGIN{maj=1;min=0;pat=0}NR==1{next}{s=$2;if(s~/^[A-Za-z]+(\([^)]*\))?!:/){maj++;min=0;pat=0}else if(s~/^feat(\([^)]*\))?:/){min++;pat=0}else{pat++}}END{print maj"."min"."pat}')
          tmp=$(mktemp)
          sed -E "s/^version = \"[^\"]*\"/version = \"$v\"/" Cargo.toml > "$tmp" && mv "$tmp" Cargo.toml
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build and package the apps (.debs for Ubuntu 26.04)
        run: |
          cargo build --release -p immich-mount-gnome -p immich-mount-kde
          root=dist/deb-app
          install -Dm755 target/release/immich-mount-gnome "$root/usr/bin/immich-mount-gnome"
          install -Dm644 LICENSE "$root/usr/share/doc/immich-mount-gnome/copyright"
          python3 packaging/third-party-licenses.py "$root/usr/share/doc/immich-mount-gnome/THIRD-PARTY-LICENSES.md" immich-mount-gnome
          mkdir -p "$root/DEBIAN"
          sed -e "s/@VERSION@/$VERSION/" -e "s/@ARCH@/amd64/" packaging/deb/immich-mount-gnome.control.in > "$root/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$root" "dist/immich-mount-gnome_${VERSION}_amd64.deb"
          root=dist/deb-kde
          install -Dm755 target/release/immich-mount-kde "$root/usr/bin/immich-mount-kde"
          install -Dm644 LICENSE "$root/usr/share/doc/immich-mount-kde/copyright"
          python3 packaging/third-party-licenses.py "$root/usr/share/doc/immich-mount-kde/THIRD-PARTY-LICENSES.md" immich-mount-kde
          mkdir -p "$root/DEBIAN" debian
          # The Qt libraries the binary links (dpkg-shlibdeps wants a debian/control), and the private QML ABI that
          # cxx-qt's generated registration uses, which ties the package to this release's Qt.
          echo "Source: immich-mount" > debian/control
          shlibs=$(dpkg-shlibdeps -O -e "$root/usr/bin/immich-mount-kde" | sed 's/^shlibs:Depends=//')
          abi=$(dpkg-query -W -f='${Provides}' libqt6qml6 | grep -o 'qt6-declarative-private-abi (= [^)]*)')
          sed -e "s/@VERSION@/$VERSION/" -e "s/@ARCH@/amd64/" -e "s/@QT_DEPENDS@/$shlibs, $abi/" \
            packaging/deb/immich-mount-kde.control.in > "$root/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$root" "dist/immich-mount-kde_${VERSION}_amd64.deb"
          ls -l dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-apps
          path: dist/*.deb
  build:
    needs: [test, fedora-apps, ubuntu-apps]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Stamp version (so `immich-mount --version` matches the release)
        run: |
          # Conventional-Commit semver from history (never bump by hand): the first commit is 1.0.0, then
          #   a breaking type!: -> major | feat: -> minor | anything else -> patch
          v=$(git log --reverse --format='%H%x09%s' | awk -F'\t' 'BEGIN{maj=1;min=0;pat=0}NR==1{next}{s=$2;if(s~/^[A-Za-z]+(\([^)]*\))?!:/){maj++;min=0;pat=0}else if(s~/^feat(\([^)]*\))?:/){min++;pat=0}else{pat++}}END{print maj"."min"."pat}')
          tmp=$(mktemp)
          sed -E "s/^version = \"[^\"]*\"/version = \"$v\"/" Cargo.toml > "$tmp" && mv "$tmp" Cargo.toml
          echo "stamped $v"
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        run: cross build --release -p immich-mount --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist/stage
          cp "target/${{ matrix.target }}/release/immich-mount" dist/stage/
          sed 's|@BINDIR@|%h/.local/bin|' packaging/systemd/immich-mount.service.in > dist/stage/immich-mount.service
          cp LICENSE README.md packaging/icons/*.svg dist/stage/
          # The notices of every crate linked in, which a binary copy must carry (cargo fetch puts their sources here).
          cargo fetch
          python3 packaging/third-party-licenses.py dist/stage/THIRD-PARTY-LICENSES.md immich-mount --target ${{ matrix.target }}
          tar czf "dist/immich-mount-${{ matrix.target }}.tar.gz" -C dist/stage .
      - name: Packages (.deb and .rpm, with the distributions' own tools)
        run: |
          sudo apt-get install -y -qq rpm >/dev/null
          case "${{ matrix.target }}" in
            x86_64-*) deb_arch=amd64; rpm_arch=x86_64 ;;
            aarch64-*) deb_arch=arm64; rpm_arch=aarch64 ;;
          esac
          payload="$PWD/dist/payload"
          mkdir -p "$payload"
          cp "target/${{ matrix.target }}/release/immich-mount" LICENSE README.md dist/stage/THIRD-PARTY-LICENSES.md \
            packaging/icons/*.svg packaging/desktop/dev.hviid.ImmichMount.metainfo.xml "$payload/"
          sed 's|@BINDIR@|/usr/bin|' packaging/systemd/immich-mount.service.in > "$payload/immich-mount.service"
          sed 's|@BINDIR@|/usr/bin|' packaging/desktop/dev.hviid.ImmichMount.desktop.in > "$payload/dev.hviid.ImmichMount.desktop"
          root=dist/deb
          install -Dm755 "$payload/immich-mount" "$root/usr/bin/immich-mount"
          install -Dm644 "$payload/immich-mount.service" "$root/usr/lib/systemd/user/immich-mount.service"
          install -Dm644 packaging/icons/dev.hviid.ImmichMount.svg "$root/usr/share/icons/hicolor/scalable/apps/dev.hviid.ImmichMount.svg"
          install -Dm644 packaging/icons/dev.hviid.ImmichMount-symbolic.svg \
            "$root/usr/share/icons/hicolor/symbolic/apps/dev.hviid.ImmichMount-symbolic.svg"
          install -Dm644 "$payload/dev.hviid.ImmichMount.desktop" "$root/usr/share/applications/dev.hviid.ImmichMount.desktop"
          install -Dm644 "$payload/dev.hviid.ImmichMount.metainfo.xml" "$root/usr/share/metainfo/dev.hviid.ImmichMount.metainfo.xml"
          install -Dm644 LICENSE "$root/usr/share/doc/immich-mount/copyright"
          install -Dm644 README.md "$root/usr/share/doc/immich-mount/README.md"
          install -Dm644 "$payload/THIRD-PARTY-LICENSES.md" "$root/usr/share/doc/immich-mount/THIRD-PARTY-LICENSES.md"
          mkdir -p "$root/DEBIAN"
          sed -e "s/@VERSION@/$VERSION/" -e "s/@ARCH@/$deb_arch/" packaging/deb/control.in > "$root/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$root" "dist/immich-mount_${VERSION}_${deb_arch}.deb"
          rpmbuild -bb --target "$rpm_arch" --define "_topdir $PWD/dist/rpmbuild" \
            --define "pkg_version $VERSION" --define "payload $payload" packaging/rpm/immich-mount.spec
          cp dist/rpmbuild/RPMS/*/*.rpm dist/
          ls -l dist/*.deb dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - name: Version
        id: version
        run: |
          VERSION=$(git log --reverse --format='%H%x09%s' | awk -F'\t' 'BEGIN{maj=1;min=0;pat=0}NR==1{next}{s=$2;if(s~/^[A-Za-z]+(\([^)]*\))?!:/){maj++;min=0;pat=0}else if(s~/^feat(\([^)]*\))?:/){min++;pat=0}else{pat++}}END{print maj"."min"."pat}')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Homebrew bottle (x86_64 Linux)
        run: |
          # The prebuilt binary as a bottle of the headless formula, so `brew install` pours it. A poured bottle skips
          # the formula's install, so the keg holds what install would make: the binary, its man page and the completions.
          keg="immich-mount-headless/${VERSION}"
          stage=bottlestage
          mkdir -p "$stage/$keg/bin" "$stage/$keg/share/man/man1" "$stage/$keg/share/zsh/site-functions" \
            "$stage/$keg/share/bash-completion/completions" "$stage/$keg/share/fish/vendor_completions.d"
          tar xzf art/immich-mount-x86_64-unknown-linux-musl.tar.gz -C "$stage/$keg/bin" ./immich-mount
          bin="$stage/$keg/bin/immich-mount"
          "$bin" --man > "$stage/$keg/share/man/man1/immich-mount.1"
          "$bin" completions zsh > "$stage/$keg/share/zsh/site-functions/_immich-mount"
          "$bin" completions bash > "$stage/$keg/share/bash-completion/completions/immich-mount"
          "$bin" completions fish > "$stage/$keg/share/fish/vendor_completions.d/immich-mount.fish"
          bottle="art/immich-mount-headless-${VERSION}.x86_64_linux.bottle.tar.gz"
          ( cd "$stage" && tar czf "../$bottle" immich-mount-headless )
          echo "BOTTLE_SHA=$(sha256sum "$bottle" | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: The whole app for Homebrew's cask (x86_64 Linux)
        run: |
          # One install for a desktop: the interfaces from fedora-apps, with the static daemon and command line, its
          # man page and its completions, so the cask needs no formula beside it.
          app=appstage
          mkdir -p "$app"
          tar xzf art/immich-mount-app-x86_64.tar.gz -C "$app"
          tar xzf art/immich-mount-x86_64-unknown-linux-musl.tar.gz -C "$app" ./immich-mount
          "$app/immich-mount" --man > "$app/immich-mount.1"
          "$app/immich-mount" completions zsh > "$app/_immich-mount"
          "$app/immich-mount" completions bash > "$app/immich-mount.bash"
          "$app/immich-mount" completions fish > "$app/immich-mount.fish"
          tar czf art/immich-mount-app-x86_64.tar.gz -C "$app" .
          tar tzf art/immich-mount-app-x86_64.tar.gz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" art/*.tar.gz art/*.deb art/*.rpm \
            --title "v$VERSION" --notes "Automated build from ${GITHUB_SHA:0:7}" \
            || gh release upload "v$VERSION" art/*.tar.gz art/*.deb art/*.rpm --clobber
      - name: Prune old releases (keep the latest 10)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName'); do
            gh release delete "$tag" --cleanup-tag -y || true
          done
      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::warning::TAP_DEPLOY_KEY not set: released, but the tap is not updated."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          x=$(sha256sum art/immich-mount-x86_64-unknown-linux-musl.tar.gz | awk '{print $1}')
          a=$(sha256sum art/immich-mount-aarch64-unknown-linux-musl.tar.gz | awk '{print $1}')
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@BOTTLE_SHA@/${BOTTLE_SHA}/g" -e "s/@X86_SHA@/${x}/g" -e "s/@ARM_SHA@/${a}/g" \
            ci/immich-mount-headless.rb.tmpl > /tmp/immich-mount-headless.rb
          git clone git@github.com:jakobhviid/homebrew-tap tap
          mkdir -p tap/Formula
          cp /tmp/immich-mount-headless.rb tap/Formula/immich-mount-headless.rb
          cd tap
          git config user.name "tap-bot"
          git config user.email "tap-bot@users.noreply.github.com"
          git add Formula/immich-mount-headless.rb
          git commit -m "immich-mount-headless ${VERSION}" || { echo "no formula change"; exit 0; }
          # To a candidate branch, not main: the tap's gate installs and tests the formula on every platform it
          # claims and lands it only if it passes, opening an issue there if not. Force: the branch holds one candidate.
          git push --force origin "HEAD:refs/heads/auto/formula-immich-mount-headless"

  pages:
    # The download page (immichmount.hviid.dev), built for the release just published, so its links are never stale
    # (ARCHITECTURE.md, "The download page"). It needs GitHub Pages on, with GitHub Actions as its source.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: The page for this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ needs.release.outputs.version }}" --json tagName,publishedAt,url,assets > release.json
          python3 site/build.py release.json _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
