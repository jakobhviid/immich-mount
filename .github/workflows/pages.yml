name: pages

# The download page (jakob.hviid.phd/immich-mount; ARCHITECTURE.md, "The download page"), built for the latest release,
# with the Mac download and Sparkle's feed from the newest release that has a disk image and its update file. The
# release workflow runs it after every release; run it by hand to build the page again without releasing. It needs
# GitHub Pages on, with GitHub Actions as its source.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: The page for the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site/build-latest.sh _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
