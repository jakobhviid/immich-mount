[package]
name = "immich-mount"
description = "Your Immich photos and videos as a drive in your file manager: the daemon and command line"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "immich-mount"
path = "src/main.rs"

[dependencies]
immich-mount-linux = { path = "../immich-mount-linux" }
immich-mount-core = { path = "../immich-mount-core" }
immich-api = { path = "../immich-api" }
# The look for a newer release (src/updates.rs); TLS comes with immich-api's default feature.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
log = "0.4"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = "1"
