[package]
name = "immich-mount-kde"
description = "Immich Mount for KDE Plasma: sign-in, status and settings for the Immich drive in Dolphin"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
immich-mount-desktop = { path = "../immich-mount-desktop" }
immich-mount-core = { path = "../immich-mount-core" }
immich-mount-linux = { path = "../immich-mount-linux" }
serde_json = "1"
url = "2"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
